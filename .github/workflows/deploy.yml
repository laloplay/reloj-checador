name: Deploy a Producción
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Deploy al servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            
            # Jalar últimos cambios de GitHub
            git pull origin main
            
            # Aplicar los cambios del esquema a la base de datos existente.
            # Esto es necesario porque docker-entrypoint-initdb.d solo se ejecuta la primera vez.
            echo "Aplicando actualizaciones al esquema de la base de datos..."
            # Usamos el usuario 'postgres' que es el default y agregamos ON_ERROR_STOP para que el deploy falle si hay un error de SQL.
            docker compose exec -T postgres psql -U laloplay -d reloj_checador -f /docker-entrypoint-initdb.d/01-schema.sql -v ON_ERROR_STOP=1
            
            # Reconstruir backend y frontend con el nuevo código (sin tocar BD)
            docker compose up -d --build --no-deps backend frontend
            
            # Limpiar imágenes viejas para no llenar el disco del servidor
            docker image prune -f
            
            echo "Deploy completado ✅"