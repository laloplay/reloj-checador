server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permite headers con guión bajo (device-token, etc.)
    underscores_in_headers on;

    # Proxy al backend para todas las llamadas de API
    location /api/ {
        proxy_pass         http://backend:3001/api/;
        proxy_http_version 1.1;

        # Pasar los headers originales al backend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pasar headers de autenticación explícitamente
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   device-token      $http_device_token;

        proxy_read_timeout 60s;
    }

    # SPA: todas las demás rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
